<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор дашборда</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">✎</div>
    <div>
      <h1>Редактор дашборда</h1>
      <p>Расписание, классы, новости и достижения</p>
    </div>
  </div>

  <div class="header-info">
    <a class="admin-link" href="index.html">Вернуться на дашборд</a>
  </div>
</header>

<main>
  <section class="editor">
    <h2>Уроки</h2>
    <div id="lessonsEditor"></div>

    <button class="add-button" id="addLesson">Добавить урок</button>

    <h2>Классы</h2>
    <div id="classesEditor"></div>

    <button class="add-button" id="addClass">Добавить класс</button>

    <h2>Новости и достижения</h2>
    <div id="sideNewsEditor"></div>

    <button class="add-button" id="addSideNews">Добавить запись</button>

    <h2>Бегущая строка</h2>
    <textarea id="tickerNews" rows="6" placeholder="Каждая новость — с новой строки"></textarea>

    <div class="editor-actions">
      <button id="saveButton">Сохранить изменения</button>
      <button id="resetButton">Сбросить настройки</button>
    </div>
  </section>
</main>

<div class="crop-modal" id="cropModal">
  <div class="crop-box">
    <h3>Обрезка фотографии</h3>
    <p>Выделите мышью нужную область. Соотношение — 16:9.</p>

    <div class="crop-area" id="cropArea">
      <img id="cropImage" alt="Фото для обрезки">
      <div class="crop-selection" id="cropSelection"></div>
    </div>

    <div class="editor-actions">
      <button id="cropSave">Обрезать и сохранить</button>
      <button id="cropCancel">Отмена</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_DATA = {
    lessons: [
      { start: 480, end: 525, name: "1 урок", subject: "Математика" },
      { start: 540, end: 585, name: "2 урок", subject: "Русский язык" },
      { start: 600, end: 645, name: "3 урок", subject: "Физика" },
      { start: 675, end: 720, name: "4 урок", subject: "Информатика" },
      { start: 750, end: 795, name: "5 урок", subject: "История" },
      { start: 810, end: 855, name: "6 урок", subject: "Английский язык" }
    ],
    classes: [
      { name: "5 «А»", room: "Каб. 12", teacher: "Иванова А. П." },
      { name: "6 «Б»", room: "Каб. 24", teacher: "Петров С. В." },
      { name: "7 «А»", room: "Каб. 31", teacher: "Смирнова Е. Н." },
      { name: "8 «Б»", room: "Каб. 18", teacher: "Кузнецов Д. А." },
      { name: "9 «А»", room: "Каб. 22", teacher: "Орлова М. И." },
      { name: "10 «А»", room: "Каб. 40", teacher: "Соколов В. В." },
      { name: "11 «Б»", room: "Каб. 45", teacher: "Морозова Т. С." }
    ],
    sideNews: [
      {
        type: "news",
        date: "Сегодня",
        text: "Родительское собрание для 9 классов состоится в 18:00 в актовом зале.",
        photo: ""
      },
      {
        type: "achievement",
        date: "Достижение",
        text: "Команда 10 «А» заняла 1 место в городском конкурсе по программированию.",
        photo: ""
      }
    ],
    tickerNews: [
      "Добро пожаловать в школу!",
      "Не забудьте сдать библиотечные книги до пятницы.",
      "Фотокросс состоится в субботу в 11:00."
    ]
  };

  let currentCropItem = null;

  function loadData() {
    const saved = localStorage.getItem("schoolDashboardData");

    if (!saved) {
      return structuredClone(DEFAULT_DATA);
    }

    return JSON.parse(saved);
  }

  function saveData(data) {
    localStorage.setItem("schoolDashboardData", JSON.stringify(data));
  }

  function timeToMinutes(value) {
    const parts = value.split(":");
    return Number(parts[0]) * 60 + Number(parts[1]);
  }

  function minutesToTime(minutes) {
    const hours = Math.floor(minutes / 60);
    const mins = minutes % 60;

    return `${String(hours).padStart(2, "0")}:${String(mins).padStart(2, "0")}`;
  }

  function createInput(value, placeholder) {
    const input = document.createElement("input");
    input.type = "text";
    input.value = value;
    input.placeholder = placeholder;

    return input;
  }

  function createRemoveButton(onClick) {
    const button = document.createElement("button");
    button.className = "remove-button";
    button.textContent = "Удалить";
    button.onclick = onClick;

    return button;
  }

  function renderLessons(data) {
    const box = document.getElementById("lessonsEditor");
    box.innerHTML = "";

    data.lessons.forEach((lesson, index) => {
      const row = document.createElement("div");
      row.className = "editor-row lessons-row";

      const startTime = document.createElement("input");
      startTime.type = "time";
      startTime.value = minutesToTime(lesson.start);

      const endTime = document.createElement("input");
      endTime.type = "time";
      endTime.value = minutesToTime(lesson.end);

      const name = createInput(lesson.name, "Название урока");
      const subject = createInput(lesson.subject, "Предмет");

      startTime.onchange = () => lesson.start = timeToMinutes(startTime.value);
      endTime.onchange = () => lesson.end = timeToMinutes(endTime.value);
      name.oninput = () => lesson.name = name.value;
      subject.oninput = () => lesson.subject = subject.value;

      const removeButton = createRemoveButton(() => {
        data.lessons.splice(index, 1);
        saveData(data);
        renderAll();
      });

      row.append(startTime, endTime, name, subject, removeButton);
      box.appendChild(row);
    });
  }

  function renderClasses(data) {
    const box = document.getElementById("classesEditor");
    box.innerHTML = "";

    data.classes.forEach((schoolClass, index) => {
      const row = document.createElement("div");
      row.className = "editor-row classes-row";

      const name = createInput(schoolClass.name, "Класс");
      const room = createInput(schoolClass.room, "Кабинет");
      const teacher = createInput(schoolClass.teacher, "Учитель");

      name.oninput = () => schoolClass.name = name.value;
      room.oninput = () => schoolClass.room = room.value;
      teacher.oninput = () => schoolClass.teacher = teacher.value;

      const removeButton = createRemoveButton(() => {
        data.classes.splice(index, 1);
        saveData(data);
        renderAll();
      });

      row.append(name, room, teacher, removeButton);
      box.appendChild(row);
    });
  }

  function renderSideNews(data) {
    const box = document.getElementById("sideNewsEditor");
    box.innerHTML = "";

    data.sideNews.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "editor-row news-row";

      const type = document.createElement("select");
      type.innerHTML = `
        <option value="news">Новость</option>
        <option value="achievement">Достижение</option>
      `;
      type.value = item.type;

      const date = createInput(item.date, "Дата");
      const text = createInput(item.text, "Текст");

      const photoButton = document.createElement("button");
      photoButton.className = "photo-button";
      photoButton.textContent = item.photo ? "Изменить фото" : "Загрузить фото";

      const removePhotoButton = document.createElement("button");
      removePhotoButton.className = "photo-remove-button";
      removePhotoButton.textContent = "Убрать фото";
      removePhotoButton.disabled = !item.photo;

      const removeButton = createRemoveButton(() => {
        data.sideNews.splice(index, 1);
        saveData(data);
        renderAll();
      });

      type.onchange = () => item.type = type.value;
      date.oninput = () => item.date = date.value;
      text.oninput = () => item.text = text.value;

      photoButton.onclick = () => {
        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "image/*";

        fileInput.onchange = () => {
          const file = fileInput.files[0];

          if (!file) return;

          const reader = new FileReader();

          reader.onload = () => {
            currentCropItem = item;
            openCropModal(reader.result);
          };

          reader.readAsDataURL(file);
        };

        fileInput.click();
      };

      removePhotoButton.onclick = () => {
        item.photo = "";
        saveData(data);
        renderAll();
      };

      row.append(type, date, text, photoButton, removePhotoButton, removeButton);
      box.appendChild(row);
    });
  }

  function renderAll() {
    const data = loadData();

    renderLessons(data);
    renderClasses(data);
    renderSideNews(data);

    document.getElementById("tickerNews").value =
      data.tickerNews.join("\n");
  }

  const cropModal = document.getElementById("cropModal");
  const cropArea = document.getElementById("cropArea");
  const cropImage = document.getElementById("cropImage");
  const cropSelection = document.getElementById("cropSelection");

  let isSelecting = false;
  let startX = 0;
  let startY = 0;

  function openCropModal(imageSrc) {
    cropImage.src = imageSrc;
    cropSelection.style.display = "none";
    cropModal.classList.add("active");
  }

  function closeCropModal() {
    cropModal.classList.remove("active");
    cropImage.src = "";
    currentCropItem = null;
  }

  cropArea.addEventListener("mousedown", event => {
    isSelecting = true;

    const rect = cropArea.getBoundingClientRect();

    startX = event.clientX - rect.left;
    startY = event.clientY - rect.top;

    cropSelection.style.left = `${startX}px`;
    cropSelection.style.top = `${startY}px`;
    cropSelection.style.width = "0px";
    cropSelection.style.height = "0px";
    cropSelection.style.display = "block";
  });

  cropArea.addEventListener("mousemove", event => {
    if (!isSelecting) return;

    const rect = cropArea.getBoundingClientRect();

    let currentX = event.clientX - rect.left;
    let currentY = event.clientY - rect.top;

    let width = currentX - startX;
    let height = currentY - startY;

    if (width < 0) {
      width = Math.abs(width);
      cropSelection.style.left = `${currentX}px`;
    }

    if (height < 0) {
      height = Math.abs(height);
      cropSelection.style.top = `${currentY}px`;
    }

    const targetRatio = 16 / 9;

    if (width / height > targetRatio) {
      height = width / targetRatio;
    } else {
      width = height * targetRatio;
    }

    cropSelection.style.width = `${width}px`;
    cropSelection.style.height = `${height}px`;
  });

  window.addEventListener("mouseup", () => {
    isSelecting = false;
  });

  document.getElementById("cropSave").onclick = () => {
    if (!currentCropItem) return;

    const selectionRect = cropSelection.getBoundingClientRect();
    const imageRect = cropImage.getBoundingClientRect();

    const scaleX = cropImage.naturalWidth / imageRect.width;
    const scaleY = cropImage.naturalHeight / imageRect.height;

    const cropX = (selectionRect.left - imageRect.left) * scaleX;
    const cropY = (selectionRect.top - imageRect.top) * scaleY;
    const cropWidth = selectionRect.width * scaleX;
    const cropHeight = selectionRect.height * scaleY;

    if (cropWidth < 10 || cropHeight < 10) {
      alert("Выделите область фотографии");
      return;
    }

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    const outputWidth = 900;
    const outputHeight = Math.round(outputWidth * 9 / 16);

    canvas.width = outputWidth;
    canvas.height = outputHeight;

    context.drawImage(
      cropImage,
      cropX,
      cropY,
      cropWidth,
      cropHeight,
      0,
      0,
      outputWidth,
      outputHeight
    );

    currentCropItem.photo = canvas.toDataURL("image/jpeg", 0.85);

    saveData(loadData());
    closeCropModal();
    renderAll();
  };

  document.getElementById("cropCancel").onclick = closeCropModal;

  document.getElementById("addLesson").onclick = () => {
    const data = loadData();

    data.lessons.push({
      start: 480,
      end: 525,
      name: "Новый урок",
      subject: "Предмет"
    });

    saveData(data);
    renderAll();
  };

  document.getElementById("addClass").onclick = () => {
    const data = loadData();

    data.classes.push({
      name: "Новый класс",
      room: "Кабинет",
      teacher: "Учитель"
    });

    saveData(data);
    renderAll();
  };

  document.getElementById("addSideNews").onclick = () => {
    const data = loadData();

    data.sideNews.push({
      type: "achievement",
      date: "Сегодня",
      text: "Новое достижение",
      photo: ""
    });

    saveData(data);
    renderAll();
  };

  document.getElementById("saveButton").onclick = () => {
    const data = loadData();

    data.tickerNews = document
      .getElementById("tickerNews")
      .value
      .split("\n")
      .map(item => item.trim())
      .filter(Boolean);

    saveData(data);
    alert("Изменения сохранены");
  };

  document.getElementById("resetButton").onclick = () => {
    if (confirm("Сбросить все изменения и вернуть стандартные данные?")) {
      localStorage.removeItem("schoolDashboardData");
      renderAll();
    }
  };

  renderAll();
</script>

</body>
</html>
